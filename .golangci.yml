version: "2"
run:
  timeout: 2m
linters:
  enable:
    - misspell
    - unconvert
  disable:
    - errcheck
  settings:
    revive:
      rules:
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - staticcheck
        text: 'SA1019: "io/ioutil" has been deprecated'

      # Ignore Go vet inline modernization suggestions for legacy code.
      - linters:
          - govet
        text: 'inline:'

      # Ignore non-constant format string warnings in legacy tests.
      - linters:
          - govet
        text: 'printf: non-constant format string'

      # Ignore Staticcheck quickfix/style/deprecation checks for now.
      - linters:
          - staticcheck
        text: 'QF1003:|QF1004:|QF1008:|ST1005:|SA1019:'
    paths:
      - third_party$
      - builtin$
      - examples$
      - vendor$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - vendor$
