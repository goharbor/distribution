name: Security checks

on:
  pull_request:
  push:
    branches: ['**']
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel older pushes: every introduced commit must finish scanning.
jobs:
  checks:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source and complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned scanners
        run: |
          python -m pip install -r .github/security-checks/requirements.txt
          bash script/security-checks/install-tools.sh "$RUNNER_TEMP/security-bin"
          echo "$RUNNER_TEMP/security-bin" >> "$GITHUB_PATH"

      - name: Verify scanner installation and rules
        run: |
          python -m pip check
          semgrep --version
          gitleaks version
          codespell --version
          semgrep --test --config .github/security-checks/rules script/security-checks/tests/fixtures

      - name: Test commit and report handling
        run: python -m unittest discover -s script/security-checks/tests -v

      - name: Scan every introduced commit and the complete resulting tree
        if: ${{ !cancelled() }}
        run: python script/security-checks/check.py event --report "$RUNNER_TEMP/security-report/code.json"

      - name: Upload redacted reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4.3.6
        with:
          name: security-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/security-report/code.json
            ${{ runner.temp }}/security-report/code.md
          if-no-files-found: error
          retention-days: 14
