name: CI

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    env:
      BUILDTAGS: "include_oss,include_gcs"
      CGO_ENABLED: 1
      GO111MODULE: "on"
      GOOS: linux
      COMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}',github.event.pull_request.base.sha, github.event.pull_request.head.sha) || github.sha }}

    steps:
    - uses: actions/checkout@v4
      with:
        path: src/github.com/docker/distribution
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.27.2

    - name: Dependencies
      run: |
          sudo apt-get -q update
          sudo -E apt-get -yq --no-install-suggests --no-install-recommends install python3
          cd /tmp && go install github.com/vbatts/git-validation@latest

    - name: Build
      working-directory: ./src/github.com/docker/distribution
      run: |
        bash script/security-checks/install-tools.sh "$RUNNER_TEMP/security-bin"
        export PATH="$RUNNER_TEMP/security-bin:$PATH"
        python3 script/security-checks/check.py logs --report "$RUNNER_TEMP/security-logs/report.json" -- bash -e -o pipefail -c '
          GO111MODULE=on script/setup/install-dev-tools
          go build .
          make check
          make build
          make binaries
          if [ "$GOOS" = "linux" ]; then make coverage; fi
        '

    - name: Upload redacted build-log scan report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4.3.6
      with:
        name: security-checks-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/security-logs/report.json
        if-no-files-found: error
        retention-days: 14

    - uses: codecov/codecov-action@v1
      with:
        directory: ./src/github.com/docker/distribution
