name: Security PR summary

on:
  workflow_run:
    workflows: ['Security checks']
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: security-pr-summary-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    name: Update collapsible PR security summary
    runs-on: ubuntu-latest
    steps:
      # This publisher runs from the default branch. Downloaded report content
      # is parsed as data only; PR scripts and artifacts are never executed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Create or update the PR summary comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 script/security-checks/pr_comment.py
