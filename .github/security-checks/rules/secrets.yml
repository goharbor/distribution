rules:
  - id: go-secret-to-log
    languages: [go]
    severity: ERROR
    message: "Credential data reaches a log or console sink. Remove it or redact before logging."
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: $SECRET
          - metavariable-regex:
              metavariable: $SECRET
              regex: '(?i)^(?:[\w.]+\.)?(?:\w*(?:password|passwd|passphrase|secret|token|apiKey|privateKey|authorization|credential|sessionID)\w*)$'
      - pattern: $REQ.Header.Get("Authorization")
      - pattern: $REQ.Header.Get("Cookie")
      - pattern: $REQ.BasicAuth()
    pattern-sanitizers:
      # Deliberately no sanitizer-name guesses: a helper called "mask" does
      # not prove it masks the complete value on every branch.
      - pattern: '"[REDACTED]"'
      - pattern: '"********"'
    pattern-sinks:
      - patterns:
          - pattern: $LOGGER.$METHOD(...)
          - metavariable-regex:
              metavariable: $LOGGER
              regex: '(?i)^(?:l|.*(?:log|zap|zerolog).*)$'
          - metavariable-regex:
              metavariable: $METHOD
              regex: '^(?:Print|Printf|Println|Debug|Debugf|Debugln|Info|Infof|Infoln|Warn|Warnf|Warnln|Warning|Warningf|Error|Errorf|Errorln|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln|Trace|Tracef|WithField|WithFields)$'
      - pattern: fmt.Print(...)
      - pattern: fmt.Printf(...)
      - pattern: fmt.Println(...)
      - pattern: fmt.Fprint(os.Stdout, ...)
      - pattern: fmt.Fprintf(os.Stdout, ...)
      - pattern: fmt.Fprintln(os.Stdout, ...)
      - pattern: fmt.Fprint(os.Stderr, ...)
      - pattern: fmt.Fprintf(os.Stderr, ...)
      - pattern: fmt.Fprintln(os.Stderr, ...)

  - id: go-hardcoded-secret
    languages: [go]
    severity: ERROR
    message: "Load production credentials from a secret store or runtime input instead of a string literal."
    patterns:
      - pattern-either:
          - pattern: $SECRET := "$VALUE"
          - pattern: $SECRET = "$VALUE"
          - pattern: var $SECRET = "$VALUE"
          - pattern: var $SECRET string = "$VALUE"
          - pattern: const $SECRET = "$VALUE"
          - pattern: const $SECRET string = "$VALUE"
          - pattern: '$SECRET: "$VALUE"'
      - metavariable-regex:
          metavariable: $SECRET
          regex: '(?i)^(?:[\w.]+\.)?\w*(?:password|passwd|passphrase|clientSecret|apiKey|accessToken|refreshToken|privateKey|secretKey)\w*$'
      - metavariable-regex:
          metavariable: $VALUE
          regex: '^(?!\s*$|\*+$|\[REDACTED\]$).+'

  - id: shell-secret-to-console
    languages: [bash]
    severity: ERROR
    message: "Do not print credential variables to build logs."
    patterns:
      - pattern-either:
          - pattern: echo ... $SECRET ...
          - pattern: printf ... $SECRET ...
      - metavariable-regex:
          metavariable: $SECRET
          regex: '(?i).*\b\w*(?:password|passwd|client_secret|api_key|access_token|refresh_token|private_key|secret_key)\w*\b.*'

  - id: shell-xtrace
    languages: [bash]
    severity: ERROR
    message: "Shell tracing can expose expanded credentials. Disable xtrace in production/CI scripts."
    pattern-either:
      - pattern: set -x
      - pattern: set -o xtrace
      - pattern: bash -x ...
      - pattern: sh -x ...

  - id: workflow-secret-to-console
    languages: [generic]
    severity: ERROR
    message: "Never echo GitHub Actions secrets into workflow output."
    paths:
      include: ['*.yml', '*.yaml']
    pattern-regex: '(?mi)^\s*(?:-?\s*run:\s*)?(?:echo|printf)\b[^\n]*\$\{\{\s*secrets\.'
